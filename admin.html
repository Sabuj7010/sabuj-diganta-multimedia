<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel — সবুজ দিগন্ত মাল্টিমিডিয়া</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f3f7f5;color:#17372b;margin:0}.wrap{max-width:1050px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #dbe7e1;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 25px rgba(0,0,0,.05)}h1{margin-top:0}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#0b6b4a;color:#fff}.danger{background:#a22;color:#fff}.muted{color:#6b7b74;font-size:13px}input,textarea,select{width:100%;box-sizing:border-box;margin:7px 0 12px;padding:11px;border:1px solid #d4e1dc;border-radius:9px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5ece9;text-align:left;font-size:13px}#app{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:15px;background:#e8f5ef;color:#0b6b4a;font-size:11px;font-weight:700}</style></head><body><div class="wrap"><div class="card"><h1>🔐 Admin Panel</h1><p id="status" class="muted">শুধু অনুমোদিত Google account: <b>mrboka7010@gmail.com</b></p><button id="login" class="btn primary">Google Login</button><button id="logout" class="btn danger" style="display:none">Logout</button></div><div id="app"><div class="card"><h2>Employee Profile</h2><form id="emp"><input name="id" placeholder="Employee ID" required><input name="name" placeholder="পূর্ণ নাম" required><input name="position" placeholder="পদ" required><input name="department" placeholder="Department"><input name="phone" placeholder="Official Phone"><input name="email" type="email" placeholder="Official Email"><input name="photo" placeholder="Profile Photo URL"><textarea name="bio" placeholder="Biography"></textarea><input name="skills" placeholder="Skills"><label><input name="is_public" type="checkbox" checked> Public profile</label><br><button class="btn primary">Save Employee</button></form></div><div class="card"><h2>Messages</h2><div id="messages">Loading…</div></div><div class="card"><h2>Reactions</h2><div id="reactions">Loading…</div></div></div></div><script>
const SUPABASE_URL='https://cnngqlfnexlcddynezwk.supabase.co';const SUPABASE_PUBLISHABLE_KEY='PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';const ADMIN_EMAIL='mrboka7010@gmail.com';let sb;
const statusEl=document.getElementById('status');const login=document.getElementById('login');const logout=document.getElementById('logout');const app=document.getElementById('app');
function ready(){return window.supabase&&SUPABASE_PUBLISHABLE_KEY&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_YOUR')}
async function boot(){if(!ready()){statusEl.innerHTML='প্রথমে Supabase Publishable/Anon Key বসাতে হবে।';return}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const {data:{session}}=await sb.auth.getSession();handle(session);sb.auth.onAuthStateChange((_e,s)=>handle(s));}
async function handle(session){if(!session){app.style.display='none';login.style.display='inline-block';logout.style.display='none';statusEl.innerHTML='শুধু অনুমোদিত Google account: <b>'+ADMIN_EMAIL+'</b>';return}const email=session.user.email||'';if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await sb.auth.signOut();statusEl.textContent='এই Google account অনুমোদিত নয়।';return}app.style.display='block';login.style.display='none';logout.style.display='inline-block';statusEl.innerHTML='Logged in: <span class="pill">'+email+'</span>';load();}
login.onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});logout.onclick=()=>sb.auth.signOut();
async function load(){const {data:m}=await sb.from('messages').select('*').order('created_at',{ascending:false});document.getElementById('messages').innerHTML=(m||[]).map(x=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${escapeHtml(x.name)}</b> <span class="muted">${escapeHtml(x.email)}</span><br>${escapeHtml(x.message)}<br><small>${escapeHtml(x.created_at||'')}</small></div>`).join('')||'কোনো মেসেজ নেই।';const {data:r}=await sb.from('reactions').select('reaction,created_at').order('created_at',{ascending:false});document.getElementById('reactions').innerHTML=(r||[]).map(x=>`<div>${escapeHtml(x.reaction)} <span class="muted">${escapeHtml(x.created_at||'')}</span></div>`).join('')||'কোনো রিঅ্যাকশন নেই।';}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('emp').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const row={id:f.get('id'),name:f.get('name'),position:f.get('position'),department:f.get('department'),phone:f.get('phone'),email:f.get('email'),photo:f.get('photo'),bio:f.get('bio'),skills:f.get('skills'),status:'Active',is_public:f.get('is_public')==='on'};const {error}=await sb.from('employees').upsert(row);alert(error?error.message:'Employee saved');};boot();
</script></body></html>
